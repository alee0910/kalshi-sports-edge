name: Kalshi scanner

on:
  schedule:
    # Every 20 minutes during likely game hours (all times UTC).
    # Covers MLB afternoon games (17-04 UTC) + NBA/NFL evenings (22-05 UTC).
    - cron: "*/20 * * * *"
  workflow_dispatch: {}

concurrency:
  group: scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      KALSHI_API_KEY: ${{ secrets.KALSHI_API_KEY }}
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-scanner.txt

      - name: Run scanner
        run: python -m scanner.scan

      - name: Commit dashboard data if changed
        run: |
          git config user.email "scanner@kalshi-sports-edge.local"
          git config user.name  "scanner-bot"
          git add dashboard/data/
          if git diff --staged --quiet; then
            echo "No dashboard changes."
          else
            git commit -m "scanner: update dashboard data $(date -u +%FT%TZ)"
            git push
          fi

  calibration:
    # Runs daily at 08:00 UTC, consumes a week of scans, updates reliability diagram.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      PYTHONPATH: ${{ github.workspace }}
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && contains(github.event.schedule, '0 8 * * *'))
    needs: []
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-scanner.txt
      - name: Run calibration
        run: python -m calibration.refresh
      - name: Commit calibration artifacts
        run: |
          git config user.email "scanner@kalshi-sports-edge.local"
          git config user.name  "scanner-bot"
          git add dashboard/data/calibration*
          if git diff --staged --quiet; then
            echo "No calibration changes."
          else
            git commit -m "calibration: refresh $(date -u +%FT%TZ)"
            git push
          fi
